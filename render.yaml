# Render service definition.
#
# Keeping this in the repository means the service can be recreated exactly, and a new
# ExeCom can see what the deployment actually is rather than reconstructing it by clicking
# through a dashboard.
#
# Values marked sync: false are set in the Render dashboard and never committed.

services:
  - type: web
    name: upcsg-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore

    # Touches the database, so a warm process holding a dead connection still reports
    # unhealthy - and the write keeps the Supabase project from pausing.
    healthCheckPath: /health

    # Stated rather than left to Render's default, so what triggers a production deploy is
    # answerable from the repository instead of from someone's dashboard.
    branch: main
    autoDeploy: true

    envVars:
      # Not cosmetic. Features/Dev/DevSignInEndpoint can mint admin tokens and is excluded
      # from the endpoint registry only when the environment is not Development. Getting
      # this wrong is a complete authorisation bypass.
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Supabase session pooler, port 5432. The transaction pooler on 6543 does not
      # support prepared statements, which Npgsql uses by default.
      - key: ConnectionStrings__Production
        sync: false

      # 32+ random bytes: openssl rand -base64 48
      - key: Jwt__SigningKey
        sync: false

      # Every origin the site is served from. Scheme and host only - no path, no trailing
      # slash, even when the site lives under a subpath.
      #
      # A browser will not let the frontend read a response from an origin the API has not
      # named, so a domain missing here fails as "blocked by CORS" in the console while the
      # API itself looks perfectly healthy from curl.
      - key: Cors__AllowedOrigins__0
        value: https://upcsg.spinelly.net

      # The github.io address still resolves and still serves the site, so it stays allowed
      # rather than being cut off the moment the custom domain works.
      - key: Cors__AllowedOrigins__1
        value: https://spinellya.github.io

      # Used to build media URLs for new uploads.
      # The API's own public origin. Must be the custom domain once one is attached, not
      # the onrender.com hostname: this is what gets written into URLs the browser is
      # later asked to fetch, and mixing the two origins is what turns a working upload
      # into a CORS failure on the page that displays it.
      #
      # The onrender.com hostname keeps working regardless - Render serves both - so
      # changing this is about which origin the site advertises, not which one answers.
      - key: Api__SelfUrl
        value: https://api-upcsg.spinelly.net

      # Google OAuth client id; the API checks the token was issued for it.
      - key: Google__ClientId
        sync: false

      # Optional, recommended: restricts sign-in to UP accounts.
      - key: Google__RequiredHostedDomain
        value: up.edu.ph

      # Supabase Storage. Until all six are present the API falls back to local disk,
      # which on Render is ephemeral - every deploy silently loses every uploaded image.
      # Partial configuration is treated as unconfigured and named in the startup log, so
      # check the "Media storage:" line after deploying.
      #
      # Only the two keys are secret. The project ref and region are in every Supabase URL
      # the browser sees, so they are committed here rather than retyped per environment.
      #
      # Both <ref>.supabase.co/storage/v1/s3 and the dedicated <ref>.storage.supabase.co
      # host are served. This is the one the running service uses, and it is known good:
      # it returned a signed, well-formed S3 error for a missing bucket. Recorded as
      # deployed rather than as the dashboard prefers, so a blueprint re-sync cannot swap
      # a working endpoint out from under the service.
      - key: Media__ServiceUrl
        value: https://bafxnyyeelwgmezcbtwj.supabase.co/storage/v1/s3

      # Must match the project's own region or Supabase rejects the request signature.
      # Read from the database host: aws-1-ap-south-1.pooler.supabase.com.
      - key: Media__Region
        value: ap-south-1

      # The literal bucket name, which goes straight into the presigned URL path. It must
      # exist in the Supabase project and be marked public, or the browser's upload PUT
      # comes back as an S3 NoSuchBucket error.
      - key: Media__PublicBucket
        value: media

      # Must name the same bucket as Media__PublicBucket. Changing one without the other
      # is the quiet failure: the upload lands correctly and every saved URL points at a
      # bucket that isn't there, so the images break rather than the upload.
      #
      # The /v1/ is required. Without it every image URL is a 404 - the path without it is
      # not a route at all, while with it the same request reaches the storage API and
      # answers 400 for a missing object. Uploads succeed either way, so the mistake only
      # shows up as images that never load.
      - key: Media__PublicBaseUrl
        value: https://bafxnyyeelwgmezcbtwj.supabase.co/storage/v1/object/public/media

      # GCash receipts. This bucket must NOT be public: it holds guilders' payment proof,
      # which carries their name, the amount and the transaction reference. There is no
      # PublicBaseUrl to match it. Officers read receipts through presigned GETs the API
      # mints per view, which expire after Media:ReadUrlMinutes.
      #
      # Leaving this unset is a working configuration, not a broken one, which is exactly
      # why it is dangerous: receipts fall back to the public bucket at guessable URLs and
      # nothing looks wrong. The startup "Media storage:" line says so in capitals.
      - key: Media__PrivateBucket
        value: upcsg-file-private

      # Storage -> S3 access keys in the Supabase dashboard. These are not the anon or
      # service_role keys, which are for Supabase's own REST API rather than the S3
      # protocol this talks.
      - key: Media__AccessKeyId
        sync: false
      - key: Media__SecretAccessKey
        sync: false
