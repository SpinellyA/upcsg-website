<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UpcsgWeb.FrontEnd</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,500..900;1,500..900&family=Poppins:wght@400;500;600;700;800&family=Noto+Serif:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/brand.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="img/favicon-crest.png" />
    <link href="UpcsgWeb.FrontEnd.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        // Used by the events calendar to bring the matching agenda row into view.
        window.upcsgScrollToId = id => {
            document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        };

        // Receipt screenshots are guilder-supplied URLs, so they routinely 404, expire, or
        // sit behind a login. Flag the failure instead of leaving a 0-height blank where
        // the officer expects evidence.
        window.upcsgReceiptBroken = img => {
            img.closest('.upcsg-receipt')?.classList.add('upcsg-receipt--broken');
        };

        // Picks an image file and downscales it before upload.
        //
        // Officers upload straight off a phone: 4000px, 4 MB. Sending that is slow on
        // campus wifi, and at that size a couple of hundred uploads would make a real dent
        // in the free storage tier. Capping the long edge and re-encoding to WebP cuts it
        // by roughly 10x with no visible loss at the sizes this site renders.
        window.upcsgPickImage = (maxEdge, quality) => new Promise(resolve => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';

            input.onchange = async () => {
                const file = input.files?.[0];
                if (!file) { resolve(null); return; }

                try {
                    const bitmap = await createImageBitmap(file);
                    const scale = Math.min(1, maxEdge / Math.max(bitmap.width, bitmap.height));
                    const w = Math.round(bitmap.width * scale);
                    const h = Math.round(bitmap.height * scale);

                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
                    bitmap.close();

                    const blob = await new Promise(r => canvas.toBlob(r, 'image/webp', quality));

                    // Keep whichever is smaller. Re-encoding a small PNG screenshot can
                    // make it bigger, and there is no reason to upload the worse one.
                    const useOriginal = !blob || blob.size >= file.size;
                    const chosen = useOriginal ? file : blob;

                    window.__upcsgPendingUpload = chosen;
                    resolve({
                        fileName: file.name,
                        contentType: chosen.type || file.type,
                        size: chosen.size,
                        originalSize: file.size
                    });
                } catch {
                    // Not decodable as an image; hand back the raw file and let the server
                    // reject it rather than guessing here.
                    window.__upcsgPendingUpload = file;
                    resolve({ fileName: file.name, contentType: file.type, size: file.size, originalSize: file.size });
                }
            };

            // Firing this from a Blazor click handler keeps the user-gesture requirement.
            input.click();
        });

        // Sends the file staged by upcsgPickImage. Returns "" on success, else a message.
        window.upcsgUpload = async (url, method, contentType, bearer) => {
            const body = window.__upcsgPendingUpload;
            if (!body) return 'Nothing staged to upload.';

            const headers = { 'Content-Type': contentType };

            // The local dev receiver is our own authenticated endpoint; a presigned bucket
            // URL carries its own signature and must NOT be sent an Authorization header,
            // which would invalidate the signature.
            if (method === 'POST' && bearer) {
                headers['Authorization'] = 'Bearer ' + bearer;
            }

            try {
                const res = await fetch(url, { method, headers, body });
                window.__upcsgPendingUpload = null;
                return res.ok ? '' : `Upload failed (${res.status}).`;
            } catch (e) {
                window.__upcsgPendingUpload = null;
                return 'Upload failed: ' + e.message;
            }
        };

        // Hands the event to the phone's own share sheet, which is how a student
        // actually passes something to a groupchat. Returns what happened so the page
        // can word its confirmation honestly: 'shared', 'copied', 'cancelled', 'failed'.
        //
        // navigator.share needs a secure context and a user gesture, and is absent on
        // most desktops, so copying the link is the fallback rather than an error.
        window.upcsgShare = async (title, url) => {
            if (navigator.share) {
                try {
                    await navigator.share({ title, url });
                    return 'shared';
                } catch (err) {
                    // The user dismissing the sheet is not a failure worth reporting.
                    if (err && err.name === 'AbortError') {
                        return 'cancelled';
                    }
                }
            }

            return (await window.upcsgCopyText(url)) ? 'copied' : 'failed';
        };

        // navigator.clipboard needs a secure context. Pages is HTTPS, but the local dev
        // server is plain http, so fall back rather than throwing there.
        window.upcsgCopyText = async text => {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch {
                const el = document.createElement('textarea');
                el.value = text;
                el.setAttribute('readonly', '');
                el.style.position = 'fixed';
                el.style.opacity = '0';
                document.body.appendChild(el);
                el.select();
                const ok = document.execCommand('copy');
                el.remove();
                return ok;
            }
        };

        // Session persistence. localStorage is readable by any script on the origin, so the
        // value here must stay a short-lived API token — never a Google refresh token.
        window.upcsgStorage = {
            get: key => localStorage.getItem(key),
            set: (key, value) => localStorage.setItem(key, value),
            remove: key => localStorage.removeItem(key)
        };
    </script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
